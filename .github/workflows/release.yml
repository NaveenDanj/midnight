name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: midnight
            asset_name: midnight-linux-x86_64
            archive_cmd: tar -czf ../${ASSET_NAME}.tar.gz midnight
            archive_ext: tar.gz
          - os: windows-latest
            binary_name: midnight.exe
            asset_name: midnight-windows-x86_64
            archive_cmd: 7z a ../${ASSET_NAME}.zip midnight.exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo ln -sf "$(command -v llvm-config-21)" /usr/local/bin/llvm-config
          llvm-config --version

      - name: Setup MSYS2 with LLVM (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\
          install: mingw-w64-ucrt-x86_64-llvm
          release: false

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: zig build -Doptimize=ReleaseFast

      # build.zig auto-detects LLVM under C:\msys64\ucrt64 when no
      # -Dllvm-root is given (see build.zig's windows_llvm_candidates),
      # which is exactly where the MSYS2 setup step above installs it.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: zig build -Doptimize=ReleaseFast

      - name: Package
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          mkdir -p dist
          cp "zig-out/bin/${{ matrix.binary_name }}" dist/
          cd dist
          ${{ matrix.archive_cmd }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
